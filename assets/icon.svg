      <path d="M714 470 a96 108 0 0 1 0 200 l-10 -62 a44 46 0 0 0 0 -80 z" fill="#F4E9DE"/>
      <path d="M430 330 c-26 -40 18 -62 -6 -104" stroke="#E3A574" stroke-width="40" stroke-linecap="round" fill="none"/>
      <path d="M550 336 c-26 -44 20 -70 -8 -118" stroke="#E3A574" stroke-width="40" stroke-linecap="round" fill="none" opacity=".75"/>
    </g>
  </g>
</svg>
